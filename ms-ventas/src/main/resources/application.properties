spring.application.name=ms-ventas
server.port=8083

# Conexión MySQL (Laragon puerto 3306)
spring.datasource.url=jdbc:mysql://localhost:3306/suus_ventas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# URL del microservicio de productos para comunicación HTTP (RestClient)
app.ms-productos.url=http://localhost:8082

# Seguridad JWT (misma clave compartida) y CORS
app.jwt.secret=${JWT_SECRET}
app.cors.origenes=http://localhost:5173,http://127.0.0.1:5173