spring.application.name=ms-usuarios
server.port=8081

# Conexión MySQL (Laragon puerto 3306)
spring.datasource.url=jdbc:mysql://localhost:3306/suus_usuarios?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Seguridad JWT y CORS (origen Vite 5173)
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000
app.cors.origenes=http://localhost:5173,http://127.0.0.1:5173